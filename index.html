      ' The latest turn is attached audio. Listen to the real voice; heard is its exact transcript. Only report pronunciation issues audible in this recording. ':
      ' Check only the last learner message; for an opening with no learner message, use empty correction arrays. ')+
      'Return only JSON {"heard":"audio transcript or empty","reply":"your conversational line","fix":"full corrected learner sentence only if actually wrong, otherwise empty","note":"specific explanation in Vietnamese","pron":"evidence-based audio pronunciation feedback or empty","corrections":[{"wrong":"exact learner quote","right":"minimal correction","why":"explain the actual error in Vietnamese","rule":"why the corrected form is appropriate here"}],"correctExamples":[{"text":"exact correct learner quote","why":"explain why it works in this context"}]}. Prioritize at most 3 corrections per turn. Do not invent an error to fill the schema.';
    const prompt=`Role-play for English speaking practice. You are ${SCN[chat.s][1]}. The learner is a Vietnamese office worker${roleText()?" working as: "+roleText():""}${S.lv?" at "+["","A2","B1","B2"][S.lv]+" level":""}.${extra} Conversation so far:\n${history||"(none yet, open the conversation)"}\nReply in character with 1-3 short natural spoken sentences and end with a question. ${fmt}`;
    const request=new AbortController();
    let timer,ok=true;
    try{
      const body=blob?{prompt,json:true,audio:{mime:(blob.type||"audio/webm").split(";")[0],data:await b64(blob)}}:{prompt,json:true};
      const reply=AIWEB?gem(body,request.signal).then(v=>jparse(v.text)):askJSON(prompt);
      const deadline=new Promise((_,reject)=>{
        timer=setTimeout(()=>{reject({code:"timeout"});request.abort()},blob?40000:48000);
      });
      const r=await Promise.race([reply,deadline]);
      if(!app.contains(cl))return true;
      if(blob){
        const heard=typeof r.heard==="string"?r.heard.trim():"";
        if(!heard){status.textContent="Chưa nghe rõ, bạn nói lại gần mic hơn nhé.";return true}
        chat.log.push({r:"me",t:heard,aud:true,pron:String(r.pron||"")});
      }
      const last=chat.log[chat.log.length-1];
      if((u||blob)&&last?.r==="me"){Object.assign(last,groundedFeedback(r,last.t));if(r.fix){last.fix=String(r.fix);last.note=String(r.note||"")}}
      if(typeof r.reply!=="string"||!r.reply.trim())throw new Error("Empty chat reply");
      chat.log.push({r:"ai",t:r.reply});
      persistChat();
      draw();
      status.textContent="";
      say(r.reply);
      if(u||blob)gain(blob?3:2);
    }catch(e){
      ok=!blob;
      if(app.contains(cl))status.textContent=blob?"Chưa nghe được bản thu, đang thử cách nhận diện khác…":(e?.code==="rate_limited"||e?.code==="timeout"?"AI phản hồi chậm. Bạn có thể thử lại.":"Chưa kết nối được với AI. Thử lại nhé.");
    }finally{
      clearTimeout(timer);
      working=false;
      if(app.contains(cl))controls();
    }
    return ok;
  }
  async function endSession(){
    const mine=chat.log.filter(m=>m.r==="me");
    if(mine.length<2||working||!ai)return;
    working=true;controls();
    status.textContent="Giáo viên AI đang viết nhận xét buổi học…";
    const audio=mine.filter(m=>m.aud).length;
    const transcript=chat.log.slice(-40).map(m=>m.r==="ai"?"Teacher: "+m.t:"Learner: "+m.t+(m.fix?` [correction: ${m.fix}]`:"")+(m.note?` [note: ${m.note}]`:"")+(m.pron?` [pronunciation: ${m.pron}]`:"")).join("\n");
    const oldHw=S.hw&&S.hw.items&&S.hw.items.length?` Homework from the previous lesson: ${S.hw.items.map(h=>h.task+(h.done?" (marked done)":" (not done)")).join(" | ")}.`:"";
    const prompt=`You are a warm but honest English teacher who has just finished a one-on-one speaking lesson with a Vietnamese office worker${roleText()?" working as: "+roleText():""}${S.lv?" at "+["","A2","B1","B2"][S.lv]+" level":""}. Lesson transcript with the corrections already noted:\n${transcript}\n${audio?`${audio} of ${mine.length} learner turns were heard as real audio, so pronunciation can be judged.`:"No learner turn was heard as audio, so set pronunciation to null."}${oldHw}\n${FEEDBACK_RULES} Base feedback on learner turns, not the teacher\'s own sentences. Do not force a minimum number of weaknesses. Explain what was correct as well. Return only JSON: {"summary":"nhận xét cụ thể bằng tiếng Việt","level":"ước lượng theo bằng chứng","scores":{"fluency":0-100,"grammar":0-100,"vocabulary":0-100,"pronunciation":0-100 hoặc null},"strengths":["điểm mạnh có bằng chứng"],"weaknesses":["điểm cần luyện có bằng chứng"],"corrections":[{"wrong":"trích nguyên văn học viên","right":"câu hoặc cụm sửa đúng","why":"vì sao sai","rule":"vì sao cách sửa đúng trong ngữ cảnh"}],"correctExamples":[{"text":"trích nguyên văn câu đúng","why":"vì sao đúng"}],"homeworkTopics":["past_events hoặc questions hoặc requests hoặc future_plan hoặc work_update hoặc opinions hoặc daily_life"]}. Include at most 4 corrections and 2 correct examples. Select 3 homework topics based on observed needs; do not generate hints, model sentences or homework answers.`;
    try{
      const r=AIWEB?jparse((await gem({prompt,json:true})).text):await askJSON(prompt);
      if(!app.contains(cl))return;
      const arr=a=>(Array.isArray(a)?a:[]).map(x=>String(x)).filter(Boolean).slice(0,4);
      const details=groundedFeedback(r,mine.map(m=>m.t));
      rememberLearningErrors(details,"Hội thoại: "+SCN[chat.s][0]);
      const scores={...(r.scores||{})};if(!audio){scores.pronunciation=null;scores.fluency=null}
      const level=["Pre-A1","A1","A2","B1","B2","C1","C2"].includes(r.level)&&mine.length>=6?r.level:"Chưa đủ dữ liệu";
      const rev={d:today(),scn:SCN[chat.s][0],turns:mine.length,summary:sessionEvidenceSummary(details,mine.length),level,scores,strengths:details.correctExamples.map(e=>e.text+": "+e.why),weaknesses:details.corrections.map(e=>e.wrong+" → "+e.right+": "+e.why),...details};
      S.sessions=[rev,...(S.sessions||[])].slice(0,30);
      S.hw={version:2,given:today(),items:makeHomework(r.homeworkTopics)};
      gain(10);save();
      chat.review=rev;persistChat();archiveChat();
      rv.innerHTML=reviewHTML(rev);
      drawHw($("#hw"));
      status.textContent="";
      rv.scrollIntoView({behavior:"smooth",block:"start"});
    }catch(e){
      if(app.contains(cl))status.textContent=e?.code==="rate_limited"?"AI đang bận, thử lại sau ít phút.":"Chưa viết được nhận xét lúc này, bạn bấm lại nhé."
    }finally{
      working=false;
      if(app.contains(cl))controls();
    }
  }
  function send(){
    const value=input.value.trim();
    if(!value||sendButton.disabled)return;
    input.value="";
    if(S.ui?.drafts?.["#chat"])S.ui.drafts["#chat"].ci="";
    turn(value);
  }
  function finishMic(session,message,text){
    if(session.signal.aborted||chatMicSession!==session||!app.contains(cl))return;
    chatMicSession=null;
    recorder=null;
    if(text)input.value=text;
    status.textContent=message;
    controls();
    if(text)input.focus();
  }
  async function useMic(){
    if(!canUseMic){status.textContent="Không mở được micro trong trình duyệt này. Hãy mở trang bằng Safari hoặc Chrome và cho phép dùng micro.";return}
    if(recorder?.state==="recording"){recorder.stop();controls();return}
    if(!cloudMic&&rec.on){stopRec();return}
    if(working||chatMicSession)return;
    stopAudio();
    const session=new AbortController();
    chatMicSession=session;
    status.textContent="Đang mở mic…";
    controls();
    if(!cloudMic){
      startRec(()=>{},r=>finishMic(session,r.text?"Sửa lại câu nếu cần, rồi bấm Gửi.":"Chưa nghe rõ. Kiểm tra quyền mic rồi thử lại.",r.text),false);
      if(chatMicSession===session)status.textContent="Đang nghe tiếng Anh…";
      controls();
      return;
    }
    try{
      recorder=await recordAudio(async blob=>{
        if(!blob?.size){finishMic(session,"Chưa thu được tiếng. Bật mic và thử lại.");return}
        if(session.signal.aborted||chatMicSession!==session||!app.contains(cl))return;
        chatMicSession=null;recorder=null;
        controls();
        const sent=await turn(null,blob);
        if(sent||!app.contains(cl))return;
        const fb=new AbortController();
        status.textContent="Đang chuyển lời nói thành chữ…";
        try{
          const text=await transcriptFromAudio(blob,fb.signal);
          if(text)input.value=text;
          status.textContent=text?"Sửa lại câu nếu cần, rồi bấm Gửi.":"Chưa nghe rõ. Nói lại gần mic hơn nhé.";
          if(text)input.focus();
        }catch(e){status.textContent="Chưa nhận dạng được lời nói. Bạn có thể thử lại hoặc gõ câu trả lời."}
        controls();
      },session.signal);
      if(session.signal.aborted)return;
      status.textContent="Đang ghi âm. Bấm Dừng ghi khi nói xong.";
      controls();
    }catch(e){
      const denied=e?.name==="NotAllowedError"||e?.name==="SecurityError";
      finishMic(session,denied?"Mic đang bị chặn. Cho phép dùng mic trong trình duyệt rồi thử lại.":"Không mở được mic. Kiểm tra thiết bị hoặc gõ câu trả lời.");
    }
  }
  sendButton.onclick=send;
  input.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)send()};
  input.value=S.ui?.drafts?.["#chat"]?.ci||"";
  scenario.onchange=()=>{archiveChat();chat={id:String(Date.now()),s:+scenario.value,log:[]};persistChat();status.textContent="";rv.innerHTML="";draw();controls()};
  start.onclick=()=>{archiveChat();chat={id:String(Date.now()),s:chat.s,log:[]};persistChat();rv.innerHTML="";start.textContent="Bắt đầu lại";turn()};
  endBtn.onclick=endSession;
  if(chat.review)rv.innerHTML=reviewHTML(chat.review);
  drawHw($("#hw"));
  if(cm)cm.onclick=useMic;
  draw();
  controls();
}

/* ---------- điều hướng ---------- */
function createCourse(rows){
  const lessons=rows.map(([id,level,title,outcome,source,question,choices,key,reason,phrase,task,example,transfer,options,answer])=>({id,level,title,outcome,source,question,choices,key,reason,phrase,task,example,transfer,options,answer}));
  const levels=[...new Set(lessons.map(l=>l.level))];
  const gaps=Object.fromEntries(lessons.map((l,i)=>[l.id,[["___, please.",["water"],"Xin nước uống."],["Good ___, Sam.",["morning"],"Chào Sam vào buổi sáng."],["___ I have the soup, please?",["can","could","may"],"Dùng một động từ để đưa ra lời yêu cầu lịch sự."],["What ___ does it leave?",["time"],"Hỏi giờ khởi hành."],["A table ___ two, please.",["for"],"Cho biết số người."],["Could we move it ___ Friday?",["to"],"Đổi lịch sang thứ Sáu."],["I ___ tomato soup, but this is mushroom soup.",["ordered","requested"],"Dùng động từ quá khứ."],["The refund is still ___.",["pending","outstanding"],"Khoản hoàn tiền vẫn chờ xử lý."],["Would you be ___ to offer a refund?",["willing","able","prepared"],"Hỏi về khả năng hoặc thiện chí giải quyết."],["Among ___ who responded, most agreed.",["those","people","respondents","participants"],"Chỉ nhóm đã phản hồi."],["We would appreciate ___ on this charge.",["clarification","information","details"],"Yêu cầu giải thích về khoản phí."],["The findings are consistent ___ our hypothesis.",["with"],"Giới từ đi sau consistent."],["The soup was memorable only ___ its bowl.",["for"],"Vì chiếc bát, chứ không phải hương vị."],["Were it not ___ the cost, the plan might succeed.",["for"],"Hoàn thành cấu trúc giả định."]][i]]));
  const goals=["Giao tiếp","Du lịch","Công việc","Học thuật"];
  const guest=storageRead(TRIAL_KEY)||{};
  const db=()=>{
    const owner=activeLearner?S:guest;
    return owner.courseV1??={level:"",goal:goals[0],minutes:10,current:"",work:{},notes:{},errors:{}};
  };
  const write=()=>{if(activeLearner)save();else storageWrite(TRIAL_KEY,guest)};
  const go=hash=>{if(location.hash==="#"+hash)route();else location.hash=hash};
  const unit=id=>lessons.find(l=>l.id===id);
  const url=l=>"#lesson-"+l.id;
  const link=(href,label,primary=false)=>`<a class="btn ${primary?"pri":""}" href="${href}">${esc(label)}</a>`;
  const buttons=(items,attr)=>items.map((item,i)=>`<button data-${attr}="${i}">${esc(item)}</button>`).join("");
  const wire=(attr,fn)=>app.querySelectorAll("[data-"+attr+"]").forEach(b=>b.onclick=()=>fn(+b.getAttribute("data-"+attr)));
  const steps=["Hiểu tình huống","Luyện mẫu câu","Tự vận dụng"];
  function next(){
    const d=db(),current=unit(d.current);
    if(current&&current.level===d.level&&!d.work[current.id]?.finished)return current;
    const pool=lessons.filter(l=>l.level===d.level);
    if(d.goal==="Công việc"||d.goal==="Học thuật")pool.reverse();
    return pool.find(l=>!d.work[l.id]?.finished);
  }
  function hero(){
    const d=db(),l=next(),w=l&&d.work[l.id];
    const title=l?l.title:d.level?"Bạn đã hoàn thành cấp "+d.level:"Lên lịch học với Dino";
    const detail=l?"Học xong, bạn có thể "+l.outcome.charAt(0).toLowerCase()+l.outcome.slice(1):d.level?"Ôn lại những gì đã học hoặc khám phá cấp tiếp theo.":"Chọn trình độ và thời lượng để bắt đầu buổi học.";
    const button=l?link(url(l),w?"Học tiếp":"Bắt đầu buổi học",true):link(d.level?"#course-path":"#start",d.level?"Chọn bài tiếp":"Chọn mục tiêu",true);
    return `<section class="hero dino-hero dino-daily"><div class="dino-hero-copy">
      <p class="dino-kicker">Buổi học hôm nay · ${d.minutes||10} phút${d.level?" · Cấp "+esc(d.level):""}</p>
      <h1>${esc(title)}</h1><p>${esc(detail)}</p>
      <div class="dino-hero-links">${button}${l?'<a class="dino-hero-secondary" href="#course-path">Xem lộ trình</a>':""}</div>
    </div><img class="dino-hero-image" src="./assets/dino-daily.webp" width="640" height="640" alt="" fetchpriority="high"></section>`;
  }
  function welcome(){
    const old=document.getElementById("course-welcome");if(old)old.remove();
    const d=db(),current=unit(d.current),resume=current&&!d.work[current.id]?.finished;
    app.insertAdjacentHTML("afterbegin",'<section id="course-welcome" class="hero dino-hero"><div class="dino-hero-copy"><p class="dino-kicker">Tiếng Anh công sở</p><h1>Học một chút. Dùng được ngay.</h1><p>Thử một tình huống ngắn hoặc chọn bài ngữ pháp, từ vựng theo trình độ.</p><div class="dino-hero-links">'+link(resume?url(current):"#lesson-appointment",resume?"Học tiếp bài thử":"Học thử 5 phút",true)+'<a class="dino-hero-secondary" href="#study">Xem kho bài</a></div></div><img class="dino-hero-image" src="./assets/dino-study.webp" width="720" height="720" alt=""></section>');
  }
  function start(){
    const d=db(), opts=(items,value)=>items.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("");
    app.innerHTML=`<h2>Bắt đầu học</h2><form id="course-start" class="box"><label>Mục tiêu <select name="goal">${opts(goals,d.goal)}</select></label><label>Thời gian mỗi ngày (phút) <select name="minutes">${opts([5,10,15,20,30],d.minutes)}</select></label><label>Cấp muốn học <select name="level">${opts(levels,d.level)}</select></label><div class="row"><button class="pri">Lưu và bắt đầu</button>${link("#placement","Thử xếp cấp đọc hiểu")} ${activeLearner?link("#test","Đánh giá tiếng Anh công sở"):link("#access","Mở hồ sơ để lưu")}</div></form>`;
    $("#course-start").onsubmit=e=>{e.preventDefault();const f=e.target.elements;Object.assign(d,{goal:f.goal.value,level:f.level.value,minutes:+f.minutes.value});write();go(next()?"lesson-"+next().id:"course-path")};
  }
  function path(){
    const d=db();
    app.innerHTML=`<h2>Lộ trình tiếng Anh</h2><p class="lead">Chọn bài theo điều bạn muốn làm được. Mỗi bài gồm hiểu tình huống, luyện mẫu câu và tự vận dụng.</p><div class="row">${link("#start","Chọn mục tiêu")} ${link(activeLearner?"#today":"#access",activeLearner?"Học hôm nay":"Mở hồ sơ")}</div>`+levels.map(level=>`<h3 class="sec-h">${level}</h3><div class="grid">${lessons.filter(l=>l.level===level).map(l=>`<a class="box course-link" href="${url(l)}"><strong>${esc(l.title)}</strong><p>${esc(l.outcome)}</p><small>${d.work[l.id]?.finished?"Đã hoàn thành":d.work[l.id]?"Đang học":"5–10 phút"}</small></a>`).join("")}</div>`).join("");
  }
  function lesson(l){
    const d=db();d.current=l.id;d.level=l.level;
    const w=d.work[l.id]??={step:0,draft:"",choice:null,first:null};
    write();
    const head=`<div class="row">${link("#course-path","← Lộ trình")}<span>${l.level} · ${w.finished?"Đã hoàn thành":"Bước "+(w.step+1)+"/3"}</span></div><h2>${esc(l.title)}</h2><p class="lead">${esc(l.outcome)}</p>`;
    if(w.finished){
      const following=next();
      app.innerHTML=head+`<section class="box">${activeLearner&&(S.days[today()]||0)>=goalXP()?"<p><strong>Giỏi lắm! Bạn đã đạt mục tiêu hôm nay. Cảm ơn bạn đã dành thời gian học tiếng Anh!</strong></p>":"<p><strong>Hoàn thành bài rồi, bạn làm tốt lắm!</strong></p>"}<h3>Hôm nay bạn đã làm được</h3><p>${esc(l.outcome)}</p><p class="sm">Hiểu tình huống · ${w.first===l.key?"Đúng ngay lần đầu":"Đã sửa sau gợi ý"}<br>Mẫu câu · ${esc(l.phrase)}<br>Tự vận dụng · Đã viết câu trả lời</p><h3>Bài làm của bạn</h3><p class="course-copy">${esc(w.draft)}</p><p>${w.first===l.key?"Bạn trả lời đúng câu hiểu tình huống ngay lần đầu.":"Bạn đã sửa câu hiểu tình huống sau khi xem gợi ý."}</p>${w.report?writingFeedbackHTML(w.report):w.feedback?"<p>"+esc(w.feedback)+"</p>":""}<p class="sm">${activeLearner?"Tiến độ đã được lưu vào hồ sơ.":"Bài thử đã được giữ trên trình duyệt này. Tạo hồ sơ để mang kết quả sang thiết bị khác."}${following?" Lần tới: "+esc(following.title)+".":""}</p><div class="row">${activeLearner?link("#today","Về hôm nay",true):link("#access","Lưu kết quả và học tiếp",true)}${following?link(url(following),"Học thêm một bài"):link("#course-path","Chọn bài tiếp")}<button id="revise">Sửa bài viết</button>${link("#notebook","Sổ tay và ôn tập")}</div></section>`;
      $("#revise").onclick=()=>{w.finished=false;w.step=2;lesson(l)};return;
    }
    const parts=l.source.split(" | ");
    const audio=parts.map((_,i)=>`<button data-audio="${i}">Nghe đoạn ${i+1}</button>`).join("");
    const controls=`<label>Tốc độ <select id="course-rate"><option value="1">1×</option><option value=".8">0.8×</option></select></label>`;
    const source=`<p class="course-copy">${parts.map(esc).join("<br>")}</p>`;
    const listening=["water","hello","booking","appointment","order","handover","remedy"].includes(l.id);
    const common=`<div class="row">${controls}${audio}</div>${listening?"<details><summary>Xem lời thoại</summary>"+source+"</details>":source}`;
    const recall=w.choice==null?"":w.choice===l.key?"Đúng. "+l.reason:"Thử lại nhé. "+l.reason;
    let body;
    if(w.step===0)body=common+`<h3>${esc(l.question)}</h3><div class="row">${buttons(l.choices,"choice")}</div><p role="status">${esc(recall)}</p>`;
    if(w.step===1)body=`<p class="target">${esc(l.phrase)}</p><div class="row"><button data-audio="-1">Nghe mẫu câu</button><button id="note">${d.notes[l.id]?"Đã lưu vào sổ tay":"Lưu cụm từ"}</button></div><label>Điền từ vào chỗ trống · ${esc(gaps[l.id][2])}<p lang="en">${esc(gaps[l.id][0])}</p><input id="gap-word" value="${esc(w.word||"")}" autocomplete="off"></label><button id="gap-check">Kiểm tra từ</button><p role="status" id="gap-result">${w.gapOK?"Đúng rồi.":""}</p><details><summary>Xem lại ngữ cảnh</summary>${source}</details>`;

    function list(){const val=id=>$("#filter-"+id).value;
      const filtered=lessons.filter(l=>{const a=attrs(l);return (!val("level")||l.level===val("level"))&&(!val("topic")||a.topic===val("topic"))&&(!val("time")||a.minutes===+val("time"))&&(!val("skill")||[a.skill,"Viết","Từ vựng"].includes(val("skill")))});

function route(){
  setNavMore(false);
  profileMenu.open=false;
  cancelTextMic();
  const h=(location.hash||"#today").slice(1);
  if(!activeLearner){
    document.body.classList.add("profile-locked");
    stopAudio();
    if(!dinoStudy?.render(h)&&!course.render(h))vAccess();
    window.scrollTo(0,0);
    return;
  }
  document.querySelectorAll("#nav a").forEach(a=>{const t=a.getAttribute("href").slice(1);a.classList.toggle("on",t===h||(t==="course-path"&&h.startsWith("lesson-"))||(t==="study"&&h.startsWith("study-"))||(t==="path"&&/^[po]\d+$/.test(h))||(t==="practice"&&["path","speak","listen","trans","quiz","fix"].includes(h))||(t==="notebook"&&h==="history")||(t==="today"&&(h==="test"||h==="profile")))});
  navMore.classList.toggle("on",Boolean(navSecondary.querySelector(".on")));
  cancelChatMic();if(rec.on)stopRec();stopAudio();
  if(pendingRecoveryCode){vRecoverySetup();return}
  if(h==="recovery-setup"){vProfile();$("#recovery-output").textContent="Nếu chưa lưu được mã ở bước trước, hãy bấm Tạo mã khôi phục và lưu mã mới.";return}
  const u=uById(h);
  if(dinoStudy?.render(h)||course.render(h)){rememberView();window.scrollTo(0,resumeScroll);resumeScroll=0;return}
  if(u)vUnit(u);else if(h==="path")vPath();else if(h==="assessment")vAssessment();else if(h==="test")vTest();else if(h==="profile")vProfile();else if(h==="speak")vSpeak();else if(h==="review")vReview();else if(h==="listen")vListen();else if(h==="trans")vTrans();else if(h==="quiz")vQuiz();else if(h==="fix")vFix();else if(h==="chat")vChat();else if(h==="history")viewHistory();else vToday();
  rememberView();
  window.scrollTo(0,resumeScroll);resumeScroll=0;}
const STUDY_TRIAL_KEY="tcv.study-trial.v1";
const guestStudy=storageRead(STUDY_TRIAL_KEY)||{stars:{},cards:{}};
async function submitIelts({task,question,essay,chart,file}){
  const learner=activeLearner;
  if(!learner?.token||learner.expires<=Date.now())throw Error("session_expired");
  const image=file?{mime:file.type,data:await b64(file)}:undefined;
  if(activeLearner!==learner)throw Error("session_expired");
  const response=await fetch(new URL("/writing/ielts",CFG.aiUrl),{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:learner.id,token:learner.token,task,question,essay,chart,image}),
    signal:AbortSignal.timeout(47000)
  });
  const result=await response.json();
  if(!response.ok)throw Error(result.error||"ielts_unavailable");
  return result;
}
const dinoStudy=window.DINO_STUDY_CONTENT&&window.createStudyLibrary?.({
  app,
  state:()=>activeLearner?(S.studyLibrary??={stars:{},cards:{}}):guestStudy,
  save:()=>activeLearner?save():storageWrite(STUDY_TRIAL_KEY,guestStudy),
  award:xp=>activeLearner?gain(xp):storageWrite(STUDY_TRIAL_KEY,guestStudy),
  escape:esc,
  say,
  schedule:(card,rating)=>scheduleStudyCard(card,F.Rating[rating]),
  grade:gradeAssessmentWriting,
  gradeIelts:submitIelts,
  feedback:writingFeedbackHTML,
  signedIn:()=>Boolean(activeLearner)
});
const navMore=$("#nav-more"), navSecondary=$("#nav-secondary"), profileMenu=$("#profile-menu");
function setNavMore(open){
  navMore.setAttribute("aria-expanded",String(open));
  navSecondary.classList.toggle("is-open",open);
}
navMore.onclick=()=>setNavMore(navMore.getAttribute("aria-expanded")!=="true");
$("#me").addEventListener("click",()=>{profileMenu.open=false});
navSecondary.addEventListener("click",event=>{if(event.target.closest("a"))setNavMore(false)});
document.addEventListener("click",event=>{
  if(!event.target.closest("#nav-more,#nav-secondary"))setNavMore(false);
  if(profileMenu.open&&!profileMenu.contains(event.target))profileMenu.open=false;
});
document.addEventListener("keydown",event=>{
  if(event.key!=="Escape")return;
  if(profileMenu.open){profileMenu.open=false;profileMenu.querySelector("summary").focus()}
  else if(navMore.getAttribute("aria-expanded")==="true"){setNavMore(false);navMore.focus()}
});
window.addEventListener("hashchange",route);
window.addEventListener("pageshow",event=>{if(event.persisted&&!activeLearner)restoreSession()});
window.addEventListener("storage",event=>{if(event.key===SESSION_KEY&&!event.newValue&&activeLearner){activeLearner=null;profileDirty=false;clearTimeout(profileTimer);location.reload()}});
window.__ot={finishPhones,splitPh,refOf,loadModel,recognize,toPCM};
$("#lock-profile").onclick=lockProfile;
const fbForm=$("#feedback-form");
if(fbForm)fbForm.onsubmit=async event=>{
  event.preventDefault();
  const msg=$("#fb-msg").value.trim(),status=$("#fb-status"),btn=$("#fb-send");
  if(msg.length<5){status.textContent="Bạn viết thêm vài chữ để mình hiểu rõ hơn nhé.";return}
  btn.disabled=true;status.textContent="Đang gửi góp ý…";
  try{
    const res=await fetch(new URL("/feedback",CFG.aiUrl),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        kind:$("#fb-kind").value,message:msg,contact:$("#fb-contact").value.trim(),website:$("#fb-hp").value,
        meta:{page:location.hash||"#today",learner:activeLearner?.id||"",voice:voiceChoice(),ai:selectedAI(),ua:navigator.userAgent.slice(0,180)}
      })
    });
    const out=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(out.error||"fail");
    $("#fb-msg").value="";
    status.textContent="Cảm ơn bạn! Góp ý đã được gửi thành công.";
  }catch(e){
    status.textContent=e.message==="rate_limited"?"Bạn gửi hơi nhanh, chờ một phút rồi thử lại nhé.":"Chưa gửi được lúc này. Bạn thử lại hoặc bấm gửi mail trực tiếp nhé.";
  }finally{btn.disabled=false}
};
restoreSession();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
