<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCV Talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: vui, năng lượng, như một app học nói hiện đại
   IDEA: những bong bóng hội thoại nảy ra từ bàn làm việc, mỗi bài là một bong bóng màu
   PICTURE: dải hero xanh đậm với bong bóng thoại và sóng âm; thẻ bài có ô ký hiệu âm to; vòng điểm tròn
   COLOUR and TYPE: navy #13294b, san hô #ff6b5a, vàng #ffc845, ngọc #19b39b, xanh trời #4f8cff; Be Vietnam Pro
   LAYOUT: tab dạng viên thuốc, một cột 980px, thẻ bo 20px có bóng mềm */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#0d1626);--card:light-dark(#fff,#16223a);--ink:light-dark(#13294b,#eaf0ff);--mut:light-dark(#5d6b85,#9fb0cf);--line:light-dark(#e3e8f2,#253455);--pale:light-dark(#eef2fa,#1c2a46);
--red:light-dark(#ff5a48,#ff7a6b);--sl:light-dark(#3b7bff,#6b9dff);--ok:light-dark(#12a58c,#3ad4b4);--mid:light-dark(#e8a400,#ffc845);--navy:#13294b;--yel:#ffc845;--tq:#19b39b;--sky:#4f8cff;--cor:#ff6b5a;--shadow:0 6px 24px light-dark(rgba(19,41,75,.08),rgba(0,0,0,.35))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Be Vietnam Pro",system-ui,sans-serif;font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(26px,4vw,36px)}h3{font-size:19px;font-weight:700}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px) 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px}.brand svg{width:34px;height:34px}
.stats{margin-left:auto;display:flex;gap:8px;font-size:13px;flex-wrap:wrap}
.stats span{background:var(--card);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow);font-weight:600;color:var(--mut)}.stats b{color:var(--ink)}
.stats .s1 b{color:var(--sl)}.mechip{background:var(--navy);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;text-decoration:none;box-shadow:var(--shadow);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-weight:600;min-height:44px}.chips input{accent-color:var(--red);width:18px;height:18px}.chips label:has(input:checked){background:var(--navy);color:#fff}
.field{margin:18px 0}.field>b{display:block;margin-bottom:8px}.stats .s2 b{color:var(--mid)}.stats .s3 b{color:var(--red)}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px max(4vw,14px) 10px;scrollbar-width:none}
nav a{flex:none;padding:8px 14px;color:var(--mut);text-decoration:none;font-weight:600;font-size:15px;border-radius:999px;background:var(--card);box-shadow:0 1px 3px rgba(19,41,75,.06)}
nav a.on{color:#fff;background:var(--navy)}:root[data-theme=dark] nav a.on{background:var(--sl)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) nav a.on{background:var(--sl)}}
nav a .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;text-align:center}
main{max-width:980px;margin:0 auto;padding:12px max(4vw,14px) 80px}
.lead{color:var(--mut);margin:8px 0 18px}
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#13294b 0%,#1f4d8f 100%);color:#fff;padding:clamp(22px,4vw,38px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center;margin-bottom:16px}
.hero h2{color:#fff}.hero p{color:#c9d7f2;margin:10px 0 16px}.hero svg{width:100%;height:auto;max-height:230px}
@media(max-width:620px){.hero{grid-template-columns:1fr}.hero svg{max-height:170px;order:-1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.unit{border:0;background:var(--card);padding:16px;cursor:pointer;display:grid;align-content:start;grid-template-columns:64px minmax(0,1fr);gap:4px 14px;text-align:left;font:inherit;color:inherit;border-radius:20px;height:auto;box-shadow:var(--shadow);transition:transform .15s}
.unit:hover,.unit:focus-visible{transform:translateY(-3px)}
.unit .ic{grid-row:1 / span 5;align-self:start;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:800 22px "Be Vietnam Pro",sans-serif;color:#fff}
.unit .ic svg{width:30px;height:30px}
.unit.rec{outline:3px solid var(--yel);outline-offset:-3px}
.c0{background:var(--cor)}.c1{background:var(--sky)}.c2{background:var(--tq)}.c3{background:var(--yel);color:var(--navy)!important}.c4{background:#8a6bff}.c5{background:#ff8fb1}
.num{font-size:12px;color:var(--mut);font-weight:700;text-transform:none}
.bar{height:8px;background:var(--pale);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.sm{font-size:14px;color:var(--mut)}
button,.btn{font:600 15px "Be Vietnam Pro",sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(19,41,75,.1);transition:transform .1s}
button:active,.btn:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sl);outline-offset:2px}
button.pri,.btn.pri{background:var(--red);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--red) 70%,#000)}
.hero .btn.pri{background:var(--yel);color:var(--navy);box-shadow:0 4px 0 #c99a1f}
button.sec{background:var(--sl);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--sl) 70%,#000)}
button:disabled{opacity:.5;cursor:default}
button svg,.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.center{justify-content:center}.between{justify-content:space-between}
.sec-h{margin:30px 0 12px}
.tip{background:var(--card);padding:16px 18px;border-radius:18px;box-shadow:var(--shadow);border-left:6px solid var(--yel)}.tip p{margin:6px 0}
.ph{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:10px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);flex-wrap:wrap}
.ph .t{flex:1 1 240px}.ph .en{font-weight:700}.ph .vi,.ipa{font-size:14px;color:var(--mut)}
.ipa{font-family:"Doulos SIL","Charis SIL","Lucida Sans Unicode","Be Vietnam Pro",sans-serif}
.ico{width:44px;padding:0;flex:none;background:var(--pale);box-shadow:none;color:var(--sl)}.ico svg{width:20px;height:20px}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pale);white-space:nowrap}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:baseline;background:var(--card);padding:16px;border-radius:18px;box-shadow:var(--shadow)}.dl .sp{font-weight:700;color:var(--sl)}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:clamp(20px,3vw,34px);text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--cor),var(--yel),var(--tq),var(--sky))}
.target{font-weight:700;font-size:clamp(24px,4.4vw,36px);line-height:1.3;margin:10px 0 4px;text-wrap:balance}
.wd{cursor:pointer;border-radius:6px;padding:0 2px}.wd.sel{background:var(--pale)}
.g{color:var(--ok)}.y{color:var(--mid)}.r{color:var(--red)}.r.wd{text-decoration:underline wavy;text-underline-offset:6px}
.mic{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff8a7a,var(--red));color:#fff;margin:18px auto 8px;padding:0;box-shadow:0 8px 24px color-mix(in srgb,var(--red) 45%,transparent)}
.mic svg{width:38px;height:38px}.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,72,.55)}100%{box-shadow:0 0 0 26px rgba(255,90,72,0)}}
@media(prefers-reduced-motion:reduce){.mic.live{animation:none;outline:4px solid var(--red)}.unit{transition:none}}
.score{--p:0;--c:var(--ok);width:120px;height:120px;margin:6px auto;border-radius:50%;display:grid;place-items:center;font:800 40px/1 "Be Vietnam Pro",sans-serif;background:radial-gradient(closest-side,var(--card) 79%,transparent 80% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--pale) 0)}
.score.g{--c:var(--ok)}.score.y{--c:var(--mid)}.score.r{--c:var(--red)}.score.small{width:84px;height:84px;font-size:28px}
.heard{color:var(--mut);font-size:15px;min-height:22px}
.opt{display:block;width:100%;text-align:left;border-radius:14px;margin:8px 0;padding:12px 16px;height:auto;line-height:1.4;border:2px solid var(--line);box-shadow:none}
.opt:hover{border-color:var(--sl)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card))}
.opt:disabled{opacity:1;color:var(--ink)}
textarea,input[type=text],select{width:100%;font:16px "Be Vietnam Pro",sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.box{background:var(--card);padding:18px;margin-top:14px;border-radius:20px;box-shadow:var(--shadow);text-align:left}
.err{padding:8px 0;border-top:1px solid var(--line)}
.strike{color:var(--red);text-decoration:line-through}.good{color:var(--ok);font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:52vh;overflow-y:auto;padding:14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.45}
.msg.ai{background:var(--pale);align-self:flex-start;border-bottom-left-radius:4px}.msg.me{background:var(--sl);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.fixn{font-size:14px;align-self:flex-end;max-width:85%;color:var(--mut)}
.note{font-size:14px;color:var(--mut);margin-top:10px}
.hide{display:none!important}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin:14px 0}
.kpi div{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi div::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;opacity:.18;background:var(--k,var(--sky))}
.kpi b{display:block;font-size:30px;line-height:1.15;font-weight:800;color:var(--k,var(--ink))}
.kpi .k1{--k:var(--cor)}.kpi .k2{--k:var(--sky)}.kpi .k3{--k:var(--tq)}.kpi .k4{--k:#e8a400}
.goal{height:10px;background:var(--pale);border-radius:5px;overflow:hidden;margin-top:6px}.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--cor),var(--yel))}
.phs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.phs span{padding:4px 10px;border-radius:10px;font-size:19px;background:var(--pale)}
.phs span.g{background:color-mix(in srgb,var(--ok) 18%,transparent)}.phs span.r{background:color-mix(in srgb,var(--red) 16%,transparent)}.phs span.y{background:color-mix(in srgb,var(--mid) 20%,transparent)}
.prog{height:8px;background:var(--pale);border-radius:4px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--tq));width:0;border-radius:4px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.pair{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pair button{min-height:40px;padding:0 12px;background:var(--pale);box-shadow:none}
.switch{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;margin-top:16px}
.switch input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--red)}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}td.n{text-align:right;white-space:nowrap}
@media(max-width:600px){.stats{width:100%;margin:0}.mic{width:80px;height:80px}.score{width:100px;height:100px;font-size:34px}}
</style>

ated, completed. Chỉ nhóm này mới thêm một âm tiết, đừng đọc worked thành work-ed."],"pairs":[["work","worked"],["plan","planned"],["need","needed"],["ask","asked"],["call","called"]],"p":[["I worked late and finished the slides.","Tôi làm muộn và đã làm xong slide."],["We started the project and planned every step.","Chúng tôi bắt đầu dự án và lên kế hoạch từng bước."],["The client called and asked for an update.","Khách hàng gọi và hỏi cập nhật."],["The issue was solved yesterday.","Vấn đề đã được giải quyết hôm qua."]]},{"id":"p4","lv":1,"t":"/ʃ/ và /s/, /ʧ/ và /ʤ/","s":"She không phải see, ship không phải sip","g":["/ʃ/ (she, share, session): tròn môi, đẩy nhẹ môi ra trước, lưỡi lùi về sau, luồng hơi rộng. /s/ (see, sell): môi dẹt, đầu lưỡi gần lợi trên, hơi mảnh như tiếng xì.","/ʧ/ (check, change) là /t/ nối liền /ʃ/. /ʤ/ (job, project) là /d/ nối liền /ʒ/, có rung cổ. Người Việt hay đọc job thành giốp hoặc chốp."],"pairs":[["sip","ship"],["see","she"],["sell","shell"],["save","shave"],["chin","gin"]],"p":[["Should she share the schedule?","Cô ấy có nên chia sẻ lịch không?"],["Let's check the changes in the project.","Hãy kiểm tra các thay đổi trong dự án."],["This session is about customer service.","Buổi này nói về dịch vụ khách hàng."],["I'll schedule a short chat with John.","Tôi sẽ lên lịch một cuộc trao đổi ngắn với John."]]},{"id":"p5","lv":1,"t":"/θ/ và /ð/","s":"Thank, three, this, the","g":["Đặt đầu lưỡi nhẹ giữa hai hàm răng rồi thổi hơi. /θ/ (thank, three, think) không rung cổ. /ð/ (this, that, the, they) có rung cổ.","Lỗi hay gặp: thank đọc thành tank hoặc sank, three thành tree, this thành dis. Không cần hoàn hảo ngay, nhưng phải để thấy đầu lưỡi."],"pairs":[["thin","tin"],["three","tree"],["thank","tank"],["they","day"],["think","sink"]],"p":[["Thank you for the three updates this Thursday.","Cảm ơn ba bản cập nhật thứ Năm này."],["I think that's the right thing to do.","Tôi nghĩ đó là điều đúng nên làm."],["They both agreed with the method.","Cả hai đều đồng ý với phương pháp."],["Is there anything else on this list?","Còn gì khác trong danh sách này không?"]]},{"id":"p6","lv":2,"t":"Cụm phụ âm","s":"Tasks, months, asked, desks","g":["Tiếng Việt không có hai ba phụ âm đứng liền nhau, nên ta hay bỏ bớt hoặc chèn thêm nguyên âm (desks thành đét hoặc đét-xơ).","Cách luyện: tách chậm từng âm rồi ghép dần. tasks = /t/ /æ/ /s/ /k/ /s/. months = /m/ /ʌ/ /n/ /θ/ /s/. Ưu tiên giữ âm cuối cùng vì nó mang nghĩa ngữ pháp."],"pairs":[["task","tasks"],["desk","desks"],["test","tests"],["month","months"],["ask","asked"]],"p":[["We discussed the tasks last month.","Chúng tôi đã thảo luận các đầu việc tháng trước."],["The tests take about six minutes.","Các bài kiểm tra mất khoảng sáu phút."],["She asked about the next steps.","Cô ấy hỏi về các bước tiếp theo."],["Our clients expect fast results.","Khách hàng của chúng ta mong kết quả nhanh."]]},{"id":"p7","lv":2,"t":"Nguyên âm dài và ngắn","s":"/iː/ và /ɪ/, /æ/ và /e/","g":["/iː/ (sheet, leave, team) kéo dài, môi kéo căng như cười. /ɪ/ (ship, live, fix) ngắn, môi thả lỏng. Nhầm hai âm này có thể gây hiểu nhầm khá ngại.","/æ/ (bad, man, plan) mở miệng rộng, hàm dưới hạ xuống, như giữa a và e. /e/ (bed, men, send) mở vừa."],"pairs":[["ship","sheep"],["live","leave"],["fill","feel"],["bad","bed"],["man","men"]],"p":[["Please leave the sheet on my desk.","Vui lòng để tờ giấy trên bàn tôi."],["Our team will fix it this week.","Nhóm sẽ sửa nó trong tuần này."],["The plan sounds bad for the sales team.","Kế hoạch này nghe không ổn cho đội bán hàng."],["I feel we need a bit more time.","Tôi cảm thấy chúng ta cần thêm chút thời gian."]]},{"id":"p8","lv":2,"t":"Trọng âm từ","s":"Nhấn sai trọng âm thì nói đúng âm vẫn khó hiểu","g":["Âm tiết được nhấn đọc to hơn, dài hơn, cao hơn; các âm tiết còn lại đọc nhẹ, thường thành /ə/. Ví dụ de-VEL-op, a-NAL-y-sis, COL-league, MAN-ag-er.","Người Việt hay nhấn đều mọi âm tiết như tiếng Việt, hoặc lên giọng ở âm cuối. Mẹo: danh từ hai âm tiết thường nhấn âm đầu (REport sai, rePORT đúng là ngoại lệ), động từ hai âm tiết thường nhấn âm sau (preSENT, reCORD)."],"pairs":[["present","presentation"],["develop","development"],["photo","photograph"],["economy","economic"],["manage","manager"]],"p":[["Our colleague will present the analysis.","Đồng nghiệp của chúng ta sẽ trình bày phần phân tích."],["The development team needs a decision.","Đội phát triển cần một quyết định."],["Let me introduce our new manager.","Để tôi giới thiệu quản lý mới."],["We should develop a better process.","Chúng ta nên xây dựng một quy trình tốt hơn."]]},{"id":"p9","lv":2,"t":"Nối âm, ngữ điệu, cặp dễ nghe nhầm","s":"Can và can't, fifteen và fifty","g":["Phụ âm cuối nối sang nguyên âm đầu của từ sau: check it out đọc như che-ki-tout, turn it off như tur-ni-toff, can I như ca-nai.","Ngữ điệu: câu hỏi Yes/No lên giọng ở cuối (Are you free? ↗), câu hỏi Wh- và câu kể xuống giọng (Where is the file? ↘).","Cặp hay nghe nhầm trong công việc: can đọc nhẹ /kən/ còn can't đọc mạnh và dài /kænt/. Fifteen nhấn âm sau (fif-TEEN), fifty nhấn âm đầu (FIF-ty). Nghe nhầm số là sai hẳn thông tin."],"pairs":[["can","can't"],["fifteen","fifty"],["thirteen","thirty"],["fourteen","forty"],["want","won't"]],"p":[["Can I ask a question?","Tôi hỏi một câu được không?"],["Let's check it out after lunch.","Mình xem thử sau bữa trưa nhé."],["I can join at fifteen past, but I can't stay long.","Tôi tham gia lúc mười lăm phút qua được, nhưng không ở lâu được."],["I'll pick it up as soon as I can.","Tôi sẽ nhận việc đó ngay khi có thể."]]}],"office":[{"id":"o1","lv":1,"t":"Giới thiệu bản thân","s":"Ngày đầu đi làm, gặp đồng nghiệp mới","tip":"Nói rõ âm cuối của tên team và chức danh: team /tiːm/, lead /liːd/, analyst /ˈænəlɪst/.","p":[["Hi, I'm Minh. I've just joined the marketing team.","Chào, mình là Minh. Mình vừa vào team marketing."],["I'm in charge of quality assurance for the app project.","Mình phụ trách kiểm soát chất lượng cho dự án app."],["Nice to meet you. Which team are you on?","Rất vui được gặp bạn. Bạn ở team nào?"],["I've been working here for about two years.","Mình làm ở đây khoảng hai năm rồi."],["Let me introduce you to my colleague, Lan.","Để mình giới thiệu bạn với đồng nghiệp của mình, Lan."],["Feel free to ask me if you need anything.","Cần gì cứ hỏi mình nhé."]],"d":[["David","Hi, you must be the new analyst. I'm David from Sales."],["Minh","Yes, I'm Minh. Nice to meet you, David."],["David","Nice to meet you too. How's your first week going?"],["Minh","Pretty good, thanks. Everyone has been really helpful."]],"q":[["I ___ here since last year.",["work","have worked","am work","worked"],1,"Since + mốc thời gian dùng hiện tại hoàn thành: have worked."],["Câu nào tự nhiên nhất khi nói về vai trò?",["I am responsible about QA.","I'm in charge of QA.","I take charge QA.","I'm charging QA."],1,"In charge of = phụ trách. Responsible phải đi với for."],["Which team are you ___?",["in","on","at","of"],1,"Be on a team là cách nói phổ biến (Anh Mỹ)."]]},{"id":"o2","lv":1,"t":"Small talk ở văn phòng","s":"Chuyện phiếm trước giờ họp, giờ ăn trưa","tip":"Câu hỏi Yes/No lên giọng ở cuối, câu hỏi Wh- xuống giọng.","p":[["How was your weekend?","Cuối tuần của bạn thế nào?"],["Did you do anything fun?","Bạn có làm gì vui không?"],["It's been a busy week, hasn't it?","Tuần này bận thật nhỉ?"],["Are you heading out for lunch?","Bạn chuẩn bị đi ăn trưa à?"],["Let's grab a coffee sometime.","Hôm nào đi cà phê nhé."],["Have a good weekend. See you on Monday.","Cuối tuần vui nhé. Hẹn gặp thứ Hai."]],"d":[["Anna","Morning! How was your weekend?"],["Minh","Really relaxing, thanks. I went to the beach with my family. How about you?"],["Anna","Not bad. I mostly caught up on sleep."],["Minh","Sounds like exactly what you needed."]],"q":[["It's been a long day, ___?",["isn't it","hasn't it","doesn't it","wasn't it"],1,"It's been = It has been nên câu hỏi đuôi là hasn't it."],["Đồng nghiệp hỏi How's it going? Bạn đáp:",["It's going to the office.","Pretty good, thanks. You?","Yes, it is.","I go well."],1,"How's it going là lời chào, đáp ngắn và hỏi lại."],["Let's ___ a coffee sometime.",["grab","catch","take on","get up"],0,"Grab a coffee = đi uống cà phê nhanh."]]},{"id":"o3","lv":2,"t":"Trong cuộc họp","s":"Góp ý, đồng ý, phản đối lịch sự","tip":"Nhấn trọng âm đúng: a-GREE, de-CI-sion, A-gen-da, pro-POSE.","p":[["Can I add something here?","Mình bổ sung một ý được không?"],["I see your point, but I have a different view.","Mình hiểu ý bạn, nhưng mình có góc nhìn khác."],["I completely agree with Anna on this.","Mình hoàn toàn đồng ý với Anna về điểm này."],["Could you clarify what you mean by that?","Bạn làm rõ ý đó giúp mình được không?"],["Let's move on to the next item on the agenda.","Mình chuyển sang mục tiếp theo nhé."],["So, to sum up, we've agreed to launch next month.","Tóm lại, chúng ta thống nhất ra mắt vào tháng sau."]],"d":[["Lead","Let's start. The first item is the budget for next quarter."],["Minh","Can I add something here? I think we need more for testing."],["Lead","I see your point, but we're already over budget."],["Minh","Then could we move some money from marketing?"]],"q":[["Cách phản đối lịch sự nhất:",["You're wrong.","That's a bad idea.","I see your point, but I'm not sure that will work.","No way."],2,"Ghi nhận ý người khác trước rồi mới nêu băn khoăn."],["Could you ___ what you mean?",["clarify","clear","clean","explain me"],0,"Explain me sai, phải là explain to me."],["Let's move on ___ the next item.",["to","for","at","in"],0,"Move on to = chuyển sang."]]},{"id":"o4","lv":1,"t":"Gọi điện và họp online","s":"Zoom, Teams, mạng lag, quên bật mic","tip":"Nối âm: Can I, speak up, on mute đọc liền một hơi.","p":[["Sorry, you're breaking up. Could you say that again?","Xin lỗi, tiếng bạn bị ngắt quãng. Bạn nói lại được không?"],["Can everyone see my screen?","Mọi người thấy màn hình của mình chưa?"],["I think you're on mute.","Hình như bạn đang tắt mic."],["Could   draw()}

  const gen=$("#gen");if(gen)gen.onclick=async()=>{gen.disabled=true;$("#geno").textContent="AI đang soạn câu…";
    try{const p=P();const r=await askJSON(`Write 8 short, natural English sentences a Vietnamese office worker would actually say out loud at work. Their job: ${roleText()||"office worker"}. What they want to get better at: ${(p.goals||[]).map(g=>(GOALS.find(x=>x[0]===g)||[])[1]).filter(Boolean).join(", ")||"general office communication"}. Level: ${["B1","A2","B1","B2"][S.lv||0]}. Each sentence 6 to 16 words, spoken style, no numbers written as digits. Return ONLY JSON: {"items":[{"en":"sentence","vi":"bản dịch tiếng Việt tự nhiên"}]}`);
      const items=(r.items||[]).filter(x=>x&&typeof x.en==="string").map(x=>({en:String(x.en).trim(),vi:String(x.vi||"").trim()}));items.forEach(x=>{if(!S.mine.some(m=>m.en===x.en))S.mine.unshift(x)});S.mine=S.mine.slice(0,200);save();vSpeak()}
    catch(e){$("#geno").textContent=e&&e.code==="rate_limited"?"AI đang bận, thử lại sau ít phút.":"Không soạn được lúc này, thử lại.";gen.disabled=false}};
  $("#cu").onkeydown=e=>{if(e.key==="Enter")$("#cug").click()}}

/* ---------- màn hình: ôn tập ---------- */
function vReview(){
  const due=dueCards();
  if(!due.length){const nx=Object.values(S.cards).map(c=>new Date(c.due)).sort((a,b)=>a-b)[0];
    app.innerHTML=`<h2>Ôn tập</h2><p class="lead">${Object.keys(S.cards).length?"Hết câu đến hạn rồi."+(nx?" Câu tiếp theo đến hạn lúc "+nx.toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})+".":""):"Chưa có câu nào để ôn. Luyện nói vài câu trong lộ trình, chúng sẽ tự xuất hiện ở đây đúng lúc bạn sắp quên."}</p><a class="btn pri" href="#path">Học bài mới</a>`;return}
  const en=due[0],s=SENT.find(x=>x.en===en)||S.mine.find(x=>x.en===en)||{en,vi:""};
  app.innerHTML=`<h2>Ôn tập</h2><p class="lead">Còn ${due.length} câu. Nói lại từng câu, điểm càng cao câu càng lâu quay lại.</p><div id="sc"></div><div class="row between" style="margin-top:14px"><button id="skip">Để sau</button><button class="pri hide" id="nx">Câu tiếp →</button></div>`;
  speakCard($("#sc"),s,{onScore:(sc,R)=>{recordScore(en,sc,R.stat);$("#nx").classList.remove("hide")}});
  $("#nx").onclick=vReview;$("#skip").onclick=()=>{const c=S.cards[en];c.due=new Date(Date.now()+36e5).toISOString();save();vReview()}}

/* ---------- màn hình: luyện nghe ---------- */
function vListen(mode){
  mode=mode||"type";const pool=SENT.filter(s=>!S.lv||uById(s.uid).lv<=S.lv+1);const it=pool[Math.floor(Math.random()*pool.length)];
  app.innerHTML=`<h2>Luyện nghe</h2><p class="lead">Nghe câu văn phòng thật rồi chép lại, hoặc chọn nghĩa đúng.</p>
  <div class="row"><button id="m1" class="${mode==="type"?"sec":""}">Nghe và chép</button><button id="m2" class="${mode==="mc"?"sec":""}">Nghe và chọn nghĩa</button></div>
  <div class="card" style="margin-top:14px"><div class="row center"><button class="pri" id="pl">${I.spk} Nghe</button><button id="pls">${I.slow} Nghe chậm</button></div><div id="lz" style="text-align:left;margin-top:16px"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button id="nx" class="pri">Câu khác →</button></div>`;
  $("#pl").onclick=()=>say(it.en);$("#pls").onclick=()=>say(it.en,.72);$("#m1").onclick=()=>vListen("type");$("#m2").onclick=()=>vListen("mc");$("#nx").onclick=()=>vListen(mode);
  const z=$("#lz");
  if(mode==="type"){z.innerHTML=`<input type="text" id="ty" placeholder="Gõ lại câu bạn nghe được" autocomplete="off" autocapitalize="off"><div class="row" style="margin-top:10px"><button class="sec" id="ck">Kiểm tra</button><button id="sh">Xem đáp án</button></div><div id="out"></div>`;
    const ck=()=>{const R=finishWords(it.en,$("#ty").value);$("#out").innerHTML=`<div class="box"><div class="score small ${cls(R.sc)}" style="--p:${R.sc}">${R.sc}</div><div class="target" style="font-size:22px">${R.words.map(w=>`<span class="${cls(w.sc)}">${esc(w.w)}</span>`).join(" ")}</div><div class="sm">${esc(it.vi)}</div></div>`;if(R.sc>=80)gain(3)};
    $("#ck").onclick=ck;$("#ty").onkeydown=e=>{if(e.key==="Enter")ck()};$("#sh").onclick=()=>{$("#out").innerHTML=`<div class="box"><b>${esc(it.en)}</b><div class="ipa">${esc(ipaText(it.en))}</div><div class="sm">${esc(it.vi)}</div></div>`}}
  else{const opts=[it];while(opts.length<4){const r=pool[Math.floor(Math.random()*pool.length)];if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);
    z.innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.vi)}</button>`).join("")+`<div id="out" class="note"></div>`;
    z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=opts[+b.dataset.i]===it;z.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(opts[i]===it)x.classList.add("right")});if(!ok)b.classList.add("wrong");else gain(3);$("#out").innerHTML=`Câu gốc: <b>${esc(it.en)}</b>`})}}

/* ---------- bài tập ---------- */
function quizBlock(el,items,big){let i=0,right=0;
  const draw=()=>{if(i>=items.length){el.innerHTML=`<div class="box"><b>Hoàn thành: ${right}/${items.length} câu đúng.</b><div class="row" style="margin-top:10px"><button id="rq">Làm lại</button></div></div>`;el.querySelector("#rq").onclick=()=>{i=0;right=0;if(big)items.sort(()=>Math.random()-.5);draw()};return}
    const{q,u}=items[i];
    el.innerHTML=`<div class="box"><div class="sm">${big?esc(u.t)+" · ":""}Câu ${i+1}/${items.length}</div><p style="font-weight:600;font-size:18px;margin:8px 0">${esc(q[0])}</p>${q[1].map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}<div class="note" id="ex"></div><div class="row hide" id="nxr" style="margin-top:10px"><button class="pri" id="nq">Tiếp →</button></div></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q[2];el.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("right")});if(!ok)b.classList.add("wrong");else{right++;gain(5)}
      el.querySelector("#ex").textContent=(ok?"Đúng. ":"Chưa đúng. ")+q[3];el.querySelector("#nxr").classList.remove("hide");el.querySelector("#nq").onclick=()=>{i++;draw()}})};
  draw()}
function vQuiz(){
  const os=UNITS.filter(u=>u.q);
  app.innerHTML=`<h2>Bài tập tổng hợp</h2><p class="lead">Ngữ pháp và cách diễn đạt văn phòng, xáo trộn ngẫu nhiên.</p><select id="qs"><option value="">Tất cả các bài</option>${[1,2,3].map(l=>`<option value="lv${l}">Cấp ${LV[l]}</option>`).join("")}${os.map(u=>`<option value="${u.id}">${esc(u.t)}</option>`).join("")}</select><div id="qz" style="margin-top:12px"></div>`;
  const run=()=>{const v=$("#qs").value;const it=[];os.forEach(u=>{if(!v||v===u.id||v==="lv"+u.lv)u.q.forEach(q=>it.push({q,u}))});it.sort(()=>Math.random()-.5);quizBlock($("#qz"),it,true)};
  $("#qs").onchange=run;run()}

/* ---------- AI: sửa lỗi và hội thoại ---------- */
async function askJSON(prompt){if(!ai)throw{message:"no_ai"};
  try{if(ai.json)return await ai.json(prompt,{modelTier:"quick"})}catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e}
  const r=await ai(prompt,{modelTier:"quick"});const m=r.text.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:r.text)}
const noAI=()=>IN_CLAUDE?'<p class="note">Đang kết nối AI của Claude… nếu không thấy phản hồi, tải lại trang.</p>':`<div class="box"><b>Tính năng AI chỉ có ở bản chạy trong Claude.</b><p class="sm">Bản web này tập trung chấm phát âm chi tiết. Để dùng AI sửa lỗi và hội thoại, mở TCV Talks trong Claude${CFG.claudeUrl.startsWith("http")?`: <a href="${esc(CFG.claudeUrl)}">mở bản Claude</a>`:"."}</p></div>`;
function vFix(){
  app.innerHTML=`<h2>Sửa lỗi câu</h2><p class="lead">Gõ hoặc nói một câu, email, tin nhắn công việc. AI chỉ lỗi sai, giải thích bằng tiếng Việt và gợi ý cách nói tự nhiên kiểu văn phòng.</p>
  ${ai?"":noAI()}<textarea id="tx" placeholder="Ví dụ: I want to discuss with you about the project timeline tomorrow"></textarea>
  <div class="row" style="margin-top:10px"><button class="pri" id="go" ${ai?"":"disabled"}>Sửa lỗi</button>${canRec()&&!phoneMode()?`<button id="vm">${I.mic} Nói thay vì gõ</button>`:""}</div><div id="out"></div>`;
  const vm=$("#vm");if(vm)vm.onclick=()=>{if(rec.on){stopRec();return}vm.classList.add("sec");const base=$("#tx").value;startRec(t=>$("#tx").value=(base+" "+t).trim(),r=>{vm.classList.remove("sec");if(r.text)$("#tx").value=(base+" "+r.text).trim()})};
  $("#go").onclick=async()=>{const t=$("#tx").value.trim();if(!t)return;const o=$("#out"),b=$("#go");b.disabled=true;o.innerHTML='<div class="box">Đang kiểm tra…</div>';
    try{const r=await askJSON(`Bạn là giáo viên tiếng Anh giao tiếp văn phòng cho người Việt. Người học làm công việc: ${roleText()||"nhân viên văn phòng"}. Kiểm tra đoạn sau của người học:\n"""${t}"""\nTrả về DUY NHẤT một JSON: {"score":số 0-100 cho độ chính xác,"corrected":"bản sửa đúng ngữ pháp, giữ nguyên ý","natural":"bản diễn đạt tự nhiên, chuyên nghiệp như người bản xứ ở văn phòng","errors":[{"wrong":"cụm sai","right":"cụm đúng","why":"giải thích ngắn bằng tiếng Việt"}]}. Không có lỗi thì errors là mảng rỗng.`);
      o.innerHTML=`<div class="box"><div class="row between"><b>Độ chính xác</b><span class="score small ${cls(+r.score||0)}" style="--p:${+r.score||0};margin:0">${esc(r.score)}</span></div>
      <h3 class="sec-h" style="margin-top:12px">Lỗi cần sửa</h3>${(r.errors||[]).length?r.errors.map(e=>`<div class="err"><span class="strike">${esc(e.wrong)}</span> → <span class="good">${esc(e.right)}</span><div class="sm">${esc(e.why)}</div></div>`).join(""):'<p class="good">Không có lỗi ngữ pháp.</p>'}
      <h3 class="sec-h">Bản sửa đúng</h3><p>${esc(r.corrected)} <button class="ico" style="vertical-align:middle" data-say="${esc(r.corrected)}" aria-label="Nghe">${I.spk}</button></p>
      <h3 class="sec-h">Cách nói tự nhiên hơn</h3><p><b>${esc(r.natural)}</b> <button class="ico" style="vertical-align:middle" data-say="${esc(r.natural)}" aria-label="Nghe">${I.spk}</button></p>
      <div class="row"><button class="sec" id="prn">${I.mic} Luyện nói câu này</button></div></div>`;
      o.querySelectorAll("[data-say]").forEach(x=>x.onclick=()=>say(x.dataset.say));$("#prn").onclick=()=>{curList=[{en:r.natural,vi:""}];cur=0;location.hash="speak"};gain(3)}
    catch(e){o.innerHTML=`<div class="box">${e&&e.code==="rate_limited"?"AI đang bận, thử lại sau ít phút.":"Không sửa được lúc này, thử lại."}</div>`}b.disabled=false}}
const SCN=[["Họp 1-1 với sếp","your manager in a weekly one-on-one meeting, asking about project progress and blockers"],["Phỏng vấn xin việc","an interviewer at a tech company interviewing the learner for a team leader role"],["Khách hàng phàn nàn","an upset customer whose order was charged twice; the learner is the support agent"],["Góp ý cho nhân viên","a junior agent receiving coaching feedback from the learner, who is their team leader"],["Đồng nghiệp mới","a friendly new colleague making small talk in the office kitchen"],["Báo cáo sự cố","a senior manager asking the learner about an urgent production incident"]];
let chat={s:-1,log:[]};
function defScn(){const p=P(),g=p.goals||[];if(p.role==="lead")return 3;if(g.includes("customer")||p.role==="cs")return 2;if(g.includes("interview"))return 1;if(g.includes("meet"))return 0;if(g.includes("small"))return 4;return 0}
function vChat(){
  if(chat.s<0)chat.s=defScn();
  app.innerHTML=`<h2>Hội thoại với AI</h2><p class="lead">Chọn tình huống, AI đóng vai người đối diện. Bạn nói hoặc gõ trả lời, AI vừa đáp vừa sửa câu cho bạn.</p>${ai?"":noAI()}
  <select id="cs">${SCN.map((s,i)=>`<option value="${i}" ${i===chat.s?"selected":""}>${esc(s[0])}</option>`).join("")}</select>
  <div class="chat" id="cl"></div>
  <div class="row"><input type="text" id="ci" placeholder="Trả lời bằng tiếng Anh" autocomplete="off" style="flex:1 1 220px">${canRec()&&!phoneMode()?`<button class="ico" id="cm" aria-label="Nói">${I.mic}</button>`:""}<button class="pri" id="cg" ${ai?"":"disabled"}>Gửi</button></div>
  <div class="row" style="margin-top:10px"><button id="cr" class="sec" ${ai?"":"disabled"}>${chat.log.length?"Bắt đầu lại":"Bắt đầu"}</button></div>`;
  const cl=$("#cl");
  const draw=()=>{cl.innerHTML=chat.log.length?chat.log.map(m=>m.r==="ai"?`<div class="msg ai">${esc(m.t)}</div>`:`<div class="msg me">${esc(m.t)}</div>${m.fix?`<div class="fixn">Nên nói: <b class="good">${esc(m.fix)}</b>${m.note?" · "+esc(m.note):""}</div>`:""}`).join(""):'<p class="sm">Bấm Bắt đầu để AI mở lời.</p>';cl.scrollTop=cl.scrollHeight};
  const turn=async u=>{if(!ai)return;const sc=SCN[chat.s];if(u)chat.log.push({r:"me",t:u});draw();const tr=chat.log.map(m=>(m.r==="ai"?"AI: ":"Learner: ")+m.t).join("\n");$("#cg").disabled=true;
    try{const r=await askJSON(`Role-play for English speaking practice. You are ${sc[1]}. The learner is a Vietnamese office worker${P().name?" named "+P().name:""}${roleText()?" working as: "+roleText():""}${S.lv?" at "+["","A2","B1","B2"][S.lv]+" level":""}. Conversation so far:\n${tr||"(none yet, open the conversation)"}\nReply in character with 1-3 short natural spoken sentences and end with a question. Also check the learner's LAST message only. Return ONLY JSON: {"reply":"your line","fix":"corrected natural version of the learner's last message, or empty string if it was already good or there is none","note":"giải thích lỗi rất ngắn bằng tiếng Việt, hoặc chuỗi rỗng"}`);
      const last=chat.log[chat.log.length-1];if(u&&last&&last.r==="me"&&r.fix){last.fix=r.fix;last.note=r.note}chat.log.push({r:"ai",t:r.reply||"…"});draw();say(r.reply||"");if(u)gain(2)}
    catch(e){chat.log.push({r:"ai",t:e&&e.code==="rate_limited"?"(AI đang bận, thử lại sau)":"(Không kết nối được AI)"});draw()}$("#cg").disabled=false};
  const send=()=>{const v=$("#ci").value.trim();if(!v)return;$("#ci").value="";turn(v)};
  $("#cg").onclick=send;$("#ci").onkeydown=e=>{if(e.key==="Enter")send()};
  $("#cs").onchange=()=>{chat={s:+$("#cs").value,log:[]};draw()};$("#cr").onclick=()=>{chat={s:chat.s,log:[]};$("#cr").textContent="Bắt đầu lại";draw();turn()};
  const cm=$("#cm");if(cm)cm.onclick=()=>{if(rec.on){stopRec();return}cm.classList.add("sec");startRec(t=>$("#ci").value=t,r=>{cm.classList.remove("sec");if(r.text){$("#ci").value="";turn(r.text)}})};
  draw()}

/* ---------- điều hướng ---------- */
function route(){
  const h=(location.hash||"#today").slice(1);
  document.querySelectorAll("#nav a").forEach(a=>{const t=a.getAttribute("href").slice(1);a.classList.toggle("on",t===h||(t==="path"&&/^[po]\d+$/.test(h))||(t==="today"&&(h==="test"||h==="profile")))});
  if(rec.on)stopRec();try{speechSynthesis.cancel()}catch(e){}
  const u=uById(h);
  if(u)vUnit(u);else if(h==="path")vPath();else if(h==="test")vTest();else if(h==="profile")vProfile();else if(h==="speak")vSpeak();else if(h==="review")vReview();else if(h==="listen")vListen();else if(h==="quiz")vQuiz();else if(h==="fix")vFix();else if(h==="chat")vChat();else vToday();
  window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
window.__ot={finishPhones,splitPh,refOf,loadModel,recognize,toPCM,S};
stats();route();
}
</script>
</body>
